name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      connection: ${{ steps.contracts.outputs.connection }}
      installed: ${{ steps.contracts.outputs.installed }}
      contracts: ${{ steps.contracts.outputs.contracts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test native QA contract selection
        run: python -B -m unittest discover -s scripts/qa -p 'test_*.py'
      - name: Select required native QA contracts
        id: contracts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          QA_FULL: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          args=(
            --base "${BASE_SHA}"
            --head "${HEAD_SHA}"
            --github-output "${GITHUB_OUTPUT}"
          )
          if [[ "${QA_FULL}" == "true" ]]; then
            args+=(--full)
          fi
          python -B scripts/qa/select_native_contracts.py "${args[@]}"

  build-and-test:
    needs: qa-plan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce hosted workflow release boundary
        shell: bash
        run: bash scripts/release/test-source-only-workflows.sh
      - name: Test cross-platform release archive policy
        shell: pwsh
        run: |
          python -B scripts/release/test_safe_extract_windows_release.py
          if ($LASTEXITCODE -ne 0) { throw "Mac archive-policy fixtures failed." }
          ./scripts/release/test-windows-release-policy.ps1
      - name: Check out bundled agent core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: labtether/labtether-agent
          ref: main
          path: agent-core
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent-core/go.mod
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      # WinUI/MSIX projects use MSBuild tasks that ship with Visual Studio,
      # not the bare dotnet SDK. setup-msbuild puts the VS MSBuild on PATH
      # so the PRI/AppxPackage tasks resolve during restore and build.
      # (Release.yml uses the same pattern for tag source verification.)
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      - name: Build bundled Go agent core
        shell: bash
        run: >-
          ./scripts/build-bundled-agent.sh
          --agent-repo "${GITHUB_WORKSPACE}/agent-core"
          --version "ci-${GITHUB_SHA}"
      - name: Restore
        run: msbuild tests/LabTetherAgent.Tests/LabTetherAgent.Tests.csproj -t:Restore -p:Platform=x64 -p:Configuration=Debug
      - name: Build
        run: msbuild tests/LabTetherAgent.Tests/LabTetherAgent.Tests.csproj -t:Build -p:Platform=x64 -p:Configuration=Debug -p:EnableMsixTooling=false -p:WindowsPackageType=None -p:GenerateAppxPackageOnBuild=false -p:RequireBundledAgent=true
      - name: Run selected Hub connection and credential contracts
        if: needs.qa-plan.outputs.connection == 'true'
        run: >-
          dotnet test
          --no-build
          --no-restore
          tests/LabTetherAgent.Tests/LabTetherAgent.Tests.csproj
          -p:Platform=x64
          -c Debug
          --filter
          "FullyQualifiedName~ConnectionTesterTests|FullyQualifiedName~AgentEnvironmentBuilderTests|FullyQualifiedName~SettingsValidatorTests|FullyQualifiedName~OnboardingConnectionTests"
      - name: Test
        run: dotnet test --no-build --no-restore tests/LabTetherAgent.Tests/LabTetherAgent.Tests.csproj -p:Platform=x64 -c Debug
      - name: Validate bundled child in build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $children = @(Get-ChildItem -Path "src/LabTetherAgent/bin" -Filter "labtether-agent.exe" -File -Recurse)
          if ($children.Count -eq 0) {
            throw "Build output does not contain Assets/labtether-agent.exe."
          }
          foreach ($child in $children) {
            if ($child.Directory.Name -ne "Assets") {
              throw "Bundled child was copied to an unexpected location: $($child.FullName)"
            }
            $help = & $child.FullName help
            $expectedHelp = "labtether-agent ci-$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0 -or @($help)[0] -ne $expectedHelp) {
              throw "Bundled child failed its help smoke test: $($child.FullName)"
            }
          }

  installed-product-contract:
    needs: [qa-plan, build-and-test]
    if: needs.qa-plan.outputs.installed == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out bundled agent core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: labtether/labtether-agent
          ref: main
          path: agent-core
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent-core/go.mod
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      - name: Build bundled Go agent core
        shell: bash
        run: >-
          ./scripts/build-bundled-agent.sh
          --agent-repo "${GITHUB_WORKSPACE}/agent-core"
          --version "ci-${GITHUB_SHA}"
      - name: Build and structurally smoke-test the installed payload
        shell: pwsh
        run: >-
          ./scripts/build-unpackaged.ps1
          -Arch x64
          -OutputDir "${env:RUNNER_TEMP}\labtether-installed-contract"
      - name: Report the physical-host acceptance boundary
        shell: pwsh
        env:
          SELECTED_CONTRACTS: ${{ needs.qa-plan.outputs.contracts }}
        run: |
          "Selected installed contracts: $env:SELECTED_CONTRACTS"
          Write-Output "::notice::Unsigned payload structure and bundled-child startup passed. Release promotion still requires scripts/build-unpackaged.ps1 -RequireWinUiRuntimeProbe on an interactive Windows desktop and the signed verification contract."
