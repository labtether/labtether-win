name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check out bundled agent core
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: labtether/labtether-agent
          ref: main
          path: agent-core
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent-core/go.mod
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      # WinUI/MSIX projects use MSBuild tasks that ship with Visual Studio,
      # not the bare dotnet SDK. setup-msbuild puts the VS MSBuild on PATH
      # so the PRI/AppxPackage tasks resolve during restore and build.
      # (Release.yml uses the same pattern to publish the Windows payload.)
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      - name: Build bundled Go agent core
        shell: bash
        run: >-
          ./scripts/build-bundled-agent.sh
          --agent-repo "${GITHUB_WORKSPACE}/agent-core"
          --version "ci-${GITHUB_SHA}"
      - name: Restore
        run: msbuild tests/LabTetherAgent.Tests/LabTetherAgent.Tests.csproj -t:Restore -p:Platform=x64 -p:Configuration=Debug
      - name: Build
        run: msbuild tests/LabTetherAgent.Tests/LabTetherAgent.Tests.csproj -t:Build -p:Platform=x64 -p:Configuration=Debug -p:EnableMsixTooling=false -p:WindowsPackageType=None -p:GenerateAppxPackageOnBuild=false -p:RequireBundledAgent=true
      - name: Test
        run: dotnet test --no-build --no-restore tests/LabTetherAgent.Tests/LabTetherAgent.Tests.csproj -p:Platform=x64 -c Debug
      - name: Validate bundled child in build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $children = @(Get-ChildItem -Path "src/LabTetherAgent/bin" -Filter "labtether-agent.exe" -File -Recurse)
          if ($children.Count -eq 0) {
            throw "Build output does not contain Assets/labtether-agent.exe."
          }
          foreach ($child in $children) {
            if ($child.Directory.Name -ne "Assets") {
              throw "Bundled child was copied to an unexpected location: $($child.FullName)"
            }
            $help = & $child.FullName help
            $expectedHelp = "labtether-agent ci-$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0 -or @($help)[0] -ne $expectedHelp) {
              throw "Bundled child failed its help smoke test: $($child.FullName)"
            }
          }
