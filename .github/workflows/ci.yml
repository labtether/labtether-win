name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # WinUI/MSIX projects use MSBuild tasks that ship with Visual Studio,
      # not the bare dotnet SDK. setup-msbuild puts the VS MSBuild on PATH
      # so the PRI/AppxPackage tasks resolve during restore and build.
      # (Release.yml uses the same pattern to produce MSIX artifacts.)
      - uses: microsoft/setup-msbuild@v2
      - name: Restore
        run: msbuild tests/LabTetherAgent.Tests/LabTetherAgent.Tests.csproj -t:Restore -p:Platform=x64 -p:Configuration=Debug
      - name: Build
        run: msbuild tests/LabTetherAgent.Tests/LabTetherAgent.Tests.csproj -t:Build -p:Platform=x64 -p:Configuration=Debug -p:EnableMsixTooling=false -p:WindowsPackageType=None -p:GenerateAppxPackageOnBuild=false
      - name: Test
        run: dotnet test --no-build --no-restore tests/LabTetherAgent.Tests/LabTetherAgent.Tests.csproj -p:Platform=x64 -c Debug
