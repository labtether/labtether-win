version: 2
updates:
  - package-ecosystem: nuget
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
